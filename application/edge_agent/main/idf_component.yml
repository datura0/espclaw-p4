## IDF Component Manager Manifest File
dependencies:
  espressif/human_face_detect: "*"
  espressif/esp_board_manager:
    version: "^0.5.10"
    public: true
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "2.12.3"
    rules:
      - if: "target in [esp32p4]"

  espressif2022/esp_emote_expression:
    version: "^1.0.0"
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True

  espressif2022/esp_emote_gfx:
    version: "3.0.2"
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True

  app_claw:
    path: ../../../components/common/app_claw

  app_config:
    path: ../components/app_config

  captive_dns:
    path: ../../../components/common/captive_dns

  claw_ramfs:
    path: ../../../components/claw_modules/claw_ramfs

  emote:
    path: ../../../components/common/emote
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True

  http_reuse:
    path: ../../../components/common/http_reuse

  http_server:
    path: ../components/http_server

  settings:
    path: ../../../components/common/settings

  wifi_manager:
    path: ../../../components/common/wifi_manager

  cap_lua:
    path: ../../../components/claw_capabilities/cap_lua

  espnow_bridge:
    path: ../components/espnow_bridge

  cmd_espnow:
    path: ../components/cmd_espnow

  sensor_imu:
    path: ../components/sensor_imu

  esp_video:
    path: ../../../components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True

  espressif/esp_h264:
    version: "^1.0"
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
